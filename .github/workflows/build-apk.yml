name: Build OURS APK

on:
  push:
    branches:
      - feature/full-ours-worlds
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.ours --project-name ours .

      - name: Configure Firebase Android app
        shell: bash
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "893369880607",
              "project_id": "ours-fbec8",
              "storage_bucket": "ours-fbec8.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:893369880607:android:240e62b6c7c375fd24c52a",
                "android_client_info": { "package_name": "com.ours.ours" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyAwBjEKWDs8kK4OSf89FK5J7W-ANip2AWg" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle.kts')
          if not settings.exists():
              settings = Path('android/settings.gradle')
          content = settings.read_text()
          plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          if settings.suffix == '.gradle':
              plugin = "id 'com.google.gms.google-services' version '4.4.2' apply false"
          if 'com.google.gms.google-services' not in content:
              marker = 'plugins {'
              if marker not in content:
                  raise SystemExit('Could not find plugins block in Android settings')
              content = content.replace(marker, marker + '\n    ' + plugin, 1)
              settings.write_text(content)

          app_candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit('Android app Gradle file not found')
          app_content = app.read_text()
          app_plugin = 'id("com.google.gms.google-services")'
          if app.suffix == '.gradle':
              app_plugin = "id 'com.google.gms.google-services'"
          if 'com.google.gms.google-services' not in app_content:
              app_content = re.sub(r'(plugins\s*\{)', r'\1\n    ' + app_plugin, app_content, count=1)
              app.write_text(app_content)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'android.permission.POST_NOTIFICATIONS' not in manifest_text:
              manifest_text = manifest_text.replace('    <application', permission + '    <application', 1)
              manifest.write_text(manifest_text)
          PY

      - name: Add microphone permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.RECORD_AUDIO' not in content:
              content = content.replace('    <application', permission + '    <application', 1)
          manifest.write_text(content)
          PY

      - name: Apply OURS Android branding
        shell: bash
        run: |
          sed -i 's/android:label="[^"]*"/android:label="OURS"/; s#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          # The committed source icon contains a damaged/truncated PNG stream.
          # Pillow can still recover its decodable pixels for Android mipmaps.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open("assets/ours_icon.png") as original:
              original.load()
              source = original.convert("RGBA")
          if source.width == 0 or source.height == 0:
              raise SystemExit("The OURS source icon has no recoverable image data")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in sizes.items():
              target = Path(f"android/app/src/main/res/mipmap-{density}/ic_launcher.png")
              target.parent.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target, format="PNG", optimize=False)
              print(f"Generated valid RGBA launcher icon: {target} ({size}px)")
          PY
          rm -f android/app/src/main/res/drawable/ours_icon.xml

      - name: Set Android compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle_file.read_text()
          updated, count = re.subn(
              r"compileSdk(?:Version)?\s*(?:=\s*)?flutter\.compileSdkVersion",
              "compileSdk = 36" if gradle_file.suffix == ".kts" else "compileSdkVersion 36",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate Flutter compileSdk setting")

          updated, min_count = re.subn(
              r"minSdk(?:Version)?\s*(?:=\s*)?flutter\.minSdkVersion",
              "minSdk = 23" if gradle_file.suffix == ".kts" else "minSdkVersion 23",
              updated,
              count=1,
          )
          if min_count != 1:
              raise SystemExit("Could not locate Flutter minSdk setting")

          gradle_file.write_text(updated)
          print(f"Set compile SDK to 36 and min SDK to 23 in {gradle_file}")
          PY


      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle.read_text()
          kotlin_dsl = gradle.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"

          match = re.search(r"compileOptions\s*\{", text)
          if match:
              start = match.end()
              depth = 1
              i = start
              while i < len(text) and depth:
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                  i += 1
              block = text[match.start():i]
              if enabled not in block:
                  text = text[:start] + "\n        " + enabled + text[start:]
          else:
              android = re.search(r"android\s*\{", text)
              if not android:
                  raise SystemExit("Could not locate android block")
              text = text[:android.end()] + "\n    compileOptions {\n        " + enabled + "\n    }\n" + text[android.end():]

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in text:
              text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(text)
          print("Enabled core library desugaring in", gradle)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDKs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          changed = []
          for gradle_file in root.glob("*/android/build.gradle*"):
              content = gradle_file.read_text()
              updated, count = re.subn(
                  r"(compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)",
                  r"\g<1>36",
                  content,
              )
              if count:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))
          print("Updated Android plugin compile SDK in:", changed)
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos lib

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OURS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
