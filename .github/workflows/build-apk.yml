
name: Build OURS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.duoapp --project-name ours .

      - name: Set OURS Android app label
        run: sed -i 's/android:label="ours"/android:label="OURS"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate OURS launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OURS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          
