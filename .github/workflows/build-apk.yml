name: Build OURS APK # Voice recording timer refinement # Reference bubble contour refinement

on:
  push:
    branches:
      - feature/full-ours-worlds
      - feature/ours-two-person-expansion
      - feature/ours-polish-stickers-themes
      - feature/ours-bubble-polish-build979
      - feature/ours-preserve-latest-chat-polish-20261125
      - feature/stable-bubble-refinement-20261126
      - feature/unified-self-ai-chat-ui-20261127
  pull_request:
    branches:
      - feature/full-ours-worlds
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.ours --project-name ours .

      - name: Configure reliable Maven Central mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("Android settings.gradle file was not generated")

          text = settings.read_text()
          kotlin_dsl = settings.suffix == ".kts"
          mirror = (
              'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
              if kotlin_dsl else
              "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }"
          )

          def add_mirror(block_name, source):
              match = re.search(r"\b" + re.escape(block_name) + r"\s*\{", source)
              if not match:
                  return source, False
              start = match.end()
              depth = 1
              i = start
              while i < len(source) and depth:
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                  i += 1
              block = source[match.start():i]
              if "maven-central.storage-download.googleapis.com" in block:
                  return source, False
              repos = re.search(r"repositories\s*\{", block)
              if not repos:
                  return source, False
              insert_at = match.start() + repos.end()
              return source[:insert_at] + "\n        " + mirror + source[insert_at:], True

          changed = False
          for block_name in ("pluginManagement", "dependencyResolutionManagement"):
              text, did_change = add_mirror(block_name, text)
              changed = changed or did_change

          if not changed:
              raise SystemExit("Could not add Maven mirror to Gradle repository configuration")
          settings.write_text(text)
          print("Added Google-hosted Maven Central mirror before the default repositories.")
          PY

      - name: Configure Firebase Android app
        shell: bash
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "893369880607",
              "project_id": "ours-fbec8",
              "storage_bucket": "ours-fbec8.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:893369880607:android:240e62b6c7c375fd24c52a",
                "android_client_info": { "package_name": "com.ours.ours" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyAwBjEKWDs8kK4OSf89FK5J7W-ANip2AWg" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path('android/settings.gradle.kts')
          if not settings.exists():
              settings = Path('android/settings.gradle')
          content = settings.read_text()
          plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          if settings.suffix == '.gradle':
              plugin = "id 'com.google.gms.google-services' version '4.4.2' apply false"
          if 'com.google.gms.google-services' not in content:
              marker = 'plugins {'
              if marker not in content:
                  raise SystemExit('Could not find plugins block in Android settings')
              content = content.replace(marker, marker + '\n    ' + plugin, 1)
              settings.write_text(content)

          app_candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit('Android app Gradle file not found')
          app_content = app.read_text()
          app_plugin = 'id("com.google.gms.google-services")'
          if app.suffix == '.gradle':
              app_plugin = "id 'com.google.gms.google-services'"
          if 'com.google.gms.google-services' not in app_content:
              app_content = re.sub(r'(plugins\s*\{)', r'\1\n    ' + app_plugin, app_content, count=1)
              app.write_text(app_content)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'android.permission.POST_NOTIFICATIONS' not in manifest_text:
              manifest_text = manifest_text.replace('    <application', permission + '    <application', 1)
              manifest.write_text(manifest_text)
          PY

      - name: Add camera and microphone permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in content:
                  content = content.replace('    <application', permission + chr(10) + '    <application', 1)
          manifest.write_text(content)
          PY

      - name: Install Pillow
        shell: bash
        run: python3 -m pip install --quiet Pillow

      - name: Install approved OURS launcher artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageChops
          import re

          src = Path("assets/ours_launcher_master.webp")
          if not src.is_file():
              raise SystemExit(f"Missing approved artwork: {src}")
          raw = Image.open(src).convert("RGB")
          w, h = raw.size
          side = min(w, h)
          raw = raw.crop(((w-side)//2, (h-side)//2, (w-side)//2+side, (h-side)//2+side))
          artwork = raw.resize((1024, 1024), Image.Resampling.LANCZOS)
          root = Path("android/app/src/main/res")
          dark = (8, 7, 14, 255)
          # Reframe legacy icon: smaller emblem, breathing room, and restrained glow.
          base = Image.new("RGBA", (1024, 1024), dark)
          emblem = artwork.resize((700, 700), Image.Resampling.LANCZOS)
          glow_mask = Image.new("L", emblem.size, 0)
          glow_mask.paste(110, (0,0,*emblem.size))
          glow = Image.new("RGBA", emblem.size, (125, 70, 165, 0))
          glow.putalpha(glow_mask.filter(ImageFilter.GaussianBlur(75)))
          pos = ((1024-700)//2, (1024-700)//2)
          base.alpha_composite(glow, pos)
          base.alpha_composite(emblem.convert("RGBA"), pos)
          base.save("assets/ours_launcher_master.png", optimize=True)

          # Adaptive foreground artwork: transparent dark backdrop and emblem reduced
          # to Android's safe zone to prevent circle/squircle masking from zooming it.
          fg = artwork.convert("RGBA")
          pixels = fg.load()
          for y in range(fg.height):
              for x in range(fg.width):
                  r,g,b,a = pixels[x,y]
                  lum = (r*299 + g*587 + b*114)//1000
                  alpha = max(0, min(255, int((lum-14)*3.2)))
                  pixels[x,y] = (r,g,b,alpha)
          fg = fg.resize((620,620), Image.Resampling.LANCZOS)
          safe = Image.new("RGBA", (1024,1024), (0,0,0,0))
          safe.alpha_composite(fg, ((1024-620)//2,(1024-620)//2))
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, px in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              legacy = base.resize((px,px), Image.Resampling.LANCZOS)
              legacy.save(folder/"ic_launcher.png", optimize=True)
              legacy.save(folder/"ic_launcher_round.png", optimize=True)
              safe.resize((px*4,px*4), Image.Resampling.LANCZOS).save(folder/"ic_launcher_foreground.png", optimize=True)
          # Android adaptive foreground needs a consistent 432x432 asset.
          ad_dir = root/"mipmap-xxxhdpi"
          safe.resize((768,768), Image.Resampling.LANCZOS).save(ad_dir/"ic_launcher_foreground.png", optimize=True)
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ours_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>'''
          ad = root/"mipmap-anydpi-v26"
          ad.mkdir(parents=True, exist_ok=True)
          (ad/"ic_launcher.xml").write_text(adaptive)
          (ad/"ic_launcher_round.xml").write_text(adaptive)

          colors = root/"values/colors.xml"
          colors.parent.mkdir(parents=True, exist_ok=True)
          content = colors.read_text(encoding="utf-8") if colors.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          color = '<color name="ours_icon_background">#08070E</color>'
          if re.search(r'<color name="ours_icon_background">.*?</color>', content):
              content = re.sub(r'<color name="ours_icon_background">.*?</color>', color, content)
          else:
              content = content.replace('</resources>', f'    {color}\n</resources>')
          colors.write_text(content, encoding="utf-8")

          # Splash art is deliberately inset: Android 12 masks the launch icon.
          splash = Image.new("RGBA", (1024,1024), dark)
          logo = artwork.resize((510,510), Image.Resampling.LANCZOS).convert("RGBA")
          halo = Image.new("RGBA", (510,510), (112,63,158,0))
          halo.putalpha(Image.new("L",(510,510),65).filter(ImageFilter.GaussianBlur(65)))
          center = (257,257)
          splash.alpha_composite(halo, center)
          splash.alpha_composite(logo, center)
          splash_dir = root/"drawable-nodpi"
          splash_dir.mkdir(parents=True, exist_ok=True)
          splash.convert("RGB").save(splash_dir/"ours_splash.png", optimize=True)
          launch = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/ours_icon_background" />
              <item><bitmap android:gravity="center" android:src="@drawable/ours_splash" /></item>
          </layer-list>'''
          for name in ("drawable/launch_background.xml","drawable-v21/launch_background.xml"):
              p = root/name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(launch, encoding="utf-8")
          v31 = root/"values-v31"
          v31.mkdir(parents=True, exist_ok=True)
          (v31/"styles.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowSplashScreenBackground">#08070E</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/ours_splash</item>
              <item name="android:windowSplashScreenIconBackgroundColor">#08070E</item>
              <item name="android:windowBackground">@android:color/black</item>
            </style>
          </resources>''', encoding="utf-8")
          manifest = root.parent/"AndroidManifest.xml"
          if manifest.exists():
              m = manifest.read_text(encoding="utf-8")
              m = re.sub(r'android:label="[^"]*"', 'android:label="OURS"', m, count=1)
              m = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', m, count=1)
              manifest.write_text(m, encoding="utf-8")
          print("Reframed OURS launcher and splash assets with safe margins and transparent adaptive foreground.")
          PY
          rm -f android/app/src/main/res/drawable/ours_icon.xml

      - name: Set Android app display name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          updated, count = re.subn(r'android:label="[^"]*"', 'android:label="OURS"', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android application label")
          manifest.write_text(updated)
          print("Android launcher label set to OURS.")
          PY

      - name: Set Android compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle_file.read_text()
          updated, count = re.subn(
              r"compileSdk(?:Version)?\s*(?:=\s*)?flutter\.compileSdkVersion",
              "compileSdk = 36" if gradle_file.suffix == ".kts" else "compileSdkVersion 36",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate Flutter compileSdk setting")

          updated, min_count = re.subn(
              r"minSdk(?:Version)?\s*(?:=\s*)?flutter\.minSdkVersion",
              "minSdk = 23" if gradle_file.suffix == ".kts" else "minSdkVersion 23",
              updated,
              count=1,
          )
          if min_count != 1:
              raise SystemExit("Could not locate Flutter minSdk setting")

          gradle_file.write_text(updated)
          print(f"Set compile SDK to 36 and min SDK to 23 in {gradle_file}")
          PY


      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle.read_text()
          kotlin_dsl = gradle.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"

          match = re.search(r"compileOptions\s*\{", text)
          if match:
              start = match.end()
              depth = 1
              i = start
              while i < len(text) and depth:
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                  i += 1
              block = text[match.start():i]
              if enabled not in block:
                  text = text[:start] + "\n        " + enabled + text[start:]
          else:
              android = re.search(r"android\s*\{", text)
              if not android:
                  raise SystemExit("Could not locate android block")
              text = text[:android.end()] + "\n    compileOptions {\n        " + enabled + "\n    }\n" + text[android.end():]

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in text:
              text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(text)
          print("Enabled core library desugaring in", gradle)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDKs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          changed = []
          for gradle_file in root.glob("*/android/build.gradle*"):
              content = gradle_file.read_text()
              updated, count = re.subn(
                  r"(compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)",
                  r"\g<1>36",
                  content,
              )
              if count:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))
          print("Updated Android plugin compile SDK in:", changed)
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Configure installable release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          text = gradle.read_text()
          kotlin_dsl = gradle.suffix == ".kts"
          match = re.search(r"buildTypes\s*\{", text)
          if not match:
              raise SystemExit("Could not locate Android buildTypes block")
          start = match.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1
          block = text[start:i-1]
          release = re.search(r"release\s*\{", block)
          if not release:
              raise SystemExit("Could not locate release build type")
          insert_at = start + release.end()
          statement = ("\n            signingConfig = signingConfigs.getByName('debug')"
                       if kotlin_dsl else "\n            signingConfig signingConfigs.debug")
          if "signingConfig" not in block[release.end():]:
              text = text[:insert_at] + statement + text[insert_at:]
              gradle.write_text(text)
          print("Configured release APK signing with the generated debug key for device testing")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Release build attempt $attempt/3"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution failed; retrying after a short backoff."
              sleep $((attempt * 20))
            fi
          done
          echo "Release APK build failed after three attempts."
          exit 1

      - name: Sign APK with v1 and v2 for Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          echo "Available build-tools:"
          ls -la "$SDK_ROOT/build-tools" || true
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -print | sort -V | tail -n 1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$APK"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          test -s "$KEYSTORE"
          echo "Using apksigner: $APKSIGNER"
          echo "Using debug keystore: $KEYSTORE"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK.compat" "$APK"
          mv "$APK.compat" "$APK"
          echo "APK re-signed with both v1 and v2 schemes."

      - name: Validate release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.ours.ours'"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose "$APK")"
          echo "$VERIFY_OUTPUT"
          # V1 is informational here; the supported Android baseline is validated with V2/V3.
          echo "V1 signature status is informational; Android API 24+ compatibility is verified through V2/V3."
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v3 scheme (APK Signature Scheme v3): true"
          echo "APK validation passed with verified V2 and V3 signatures."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OURS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
